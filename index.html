<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Assets/css/style.css">
    <title>Code Wizz Quiz</title>
</head>
<body>
    <header>
        <a id="scores" role="button" tabindex="0">High Scores</a>
        <div id="timer">Time: 60s</div>
    </header>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <main id="container">
        <h1 id="title">Code Wizz Quiz</h1>
        <p id="content">You have limited time to answer these coding questions. Answer incorrectly and time is deducted from the clock. Good luck!</p>
        <button id="start">Start Quiz</button>
    </main>
    <div id="answer" role="status" aria-live="polite"></div>
    <script src="./Assets/js/script.js"></script>
</body>
</html>
